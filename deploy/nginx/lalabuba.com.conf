# nginx site for lalabuba.com / www / dev — SOURCE OF TRUTH (installed to
# /etc/nginx/sites-available/lalabuba.com, symlinked into sites-enabled).
#
# Install / update (on the Hetzner host):
#   install -m 644 deploy/nginx/lalabuba.com.conf /etc/nginx/sites-available/lalabuba.com
#   nginx -t && systemctl reload nginx
#
# ORIGIN LOCK-DOWN — Cloudflare Authenticated Origin Pulls (zone setting
# "tls_client_auth" = on). Every HTTPS server block below REQUIRES the client
# certificate Cloudflare presents on origin connections, so the origin only
# answers Cloudflare. That is what makes CF-Connecting-IP trustworthy: a direct
# client can no longer reach the app to forge it (which previously defeated every
# per-IP rate limit). CA file: https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# (CN=origin-pull.cloudflare.net) at /etc/nginx/cloudflare/origin-pull-ca.pem.
#
# If AOP is ever turned off in Cloudflare, this site returns 400 for everything —
# turn AOP back on rather than removing ssl_verify_client.

server {
    listen 80; listen [::]:80;
    server_name lalabuba.com www.lalabuba.com dev.lalabuba.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.lalabuba.com;
    ssl_certificate        /etc/letsencrypt/live/lalabuba/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/lalabuba/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;
    return 301 https://lalabuba.com$request_uri;
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name lalabuba.com;
    ssl_certificate        /etc/letsencrypt/live/lalabuba/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/lalabuba/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only Cloudflare can connect (ssl_verify_client), and Cloudflare overwrites
        # any client-sent CF-Connecting-IP — so this is the real client address.
        proxy_set_header X-Real-IP          $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 175s;
    }
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name dev.lalabuba.com;
    ssl_certificate        /etc/letsencrypt/live/lalabuba/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/lalabuba/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP          $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 175s;
    }
}
