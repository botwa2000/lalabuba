workflows:
  # ── Flutter iOS release — manual only ────────────────────────────────────────
  # Triggered via Codemagic API by Claude when a Flutter release is approved.
  # workflowId to use in API call: "flutter-release"
  flutter-release:
    name: Lalabuba Flutter iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events: []   # no automatic triggers — Claude triggers via API

    integrations:
      app_store_connect: Bonistock ASC

    working_directory: flutter_app

    environment:
      groups:
        - ios-signing
      vars:
        APP_STORE_APPLE_ID: "6761691648"
      flutter: stable

    scripts:
      - name: Compute CFBundleVersion (must exceed latest TestFlight)
        script: |
          # CFBundleVersion MUST be strictly greater than the latest build already on
          # App Store Connect. A fixed BUILD_NUMBER+offset scheme broke when Codemagic's
          # build index reset (index 6 → 1006) and collided below an existing TestFlight
          # build (1067). Fetch the real latest from ASC and increment. The value is
          # exported via $CM_ENV and passed EXPLICITLY to `flutter build ipa
          # --build-number` below, so it can never be silently dropped.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if ! echo "$LATEST" | grep -qE '^[0-9]+$'; then LATEST=0; fi
          CODE=$((LATEST + 1))
          # Safety floor: never publish at/below the known-good baseline (1067).
          if [ "$CODE" -le 1067 ]; then CODE=1068; fi
          echo "BUILD_CODE=$CODE" >> $CM_ENV
          echo ">>> latest TestFlight build=${LATEST}; will build CFBundleVersion=${CODE}"

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Run tests
        script: flutter test

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing certificate & provisioning profile
        script: |
          app-store-connect fetch-signing-files com.lalabuba.lalabuba \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CM_CERTIFICATE_PRIVATE_KEY

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing profiles to Xcode project
        script: |
          # Write the export-options plist to an explicit path that the build step
          # also references — the auto $CM_EXPORT_OPTIONS_PLIST var was coming through
          # empty, which made `flutter build ipa` fail ("property list does not exist").
          xcode-project use-profiles --export-options-plist "$CM_BUILD_DIR/export_options.plist"

      - name: Build Flutter IPA
        script: |
          # Capture full verbose output to a log file that is published as an artifact
          # (Codemagic's API does not expose step logs; artifacts ARE downloadable).
          # pipefail keeps the step failing on error while still writing the log.
          set -o pipefail
          echo ">>> building IPA with CFBundleVersion (--build-number) = ${BUILD_CODE}"
          flutter build ipa --release --verbose \
            --build-number="${BUILD_CODE}" \
            --export-options-plist="$CM_BUILD_DIR/export_options.plist" 2>&1 | tee "$CM_BUILD_DIR/flutter_build_ipa.log"

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          LOG="$CM_BUILD_DIR/dsym_upload.log"
          GSVC_PLIST="ios/Runner/GoogleService-Info.plist"
          {
            # Firebase iOS SDK 11.x ships as xcframeworks; upload-symbols is no
            # longer in Pods/. Fetch the script from the Firebase GitHub repo.
            UPLOAD_BIN="/tmp/firebase-upload-symbols"
            if [ ! -f "$UPLOAD_BIN" ]; then
              echo ">>> Downloading upload-symbols from Firebase GitHub..."
              curl -fsSL -o "$UPLOAD_BIN" \
                "https://raw.githubusercontent.com/firebase/firebase-ios-sdk/main/Crashlytics/upload-symbols"
              chmod +x "$UPLOAD_BIN"
            fi
            FILE_TYPE=$(file "$UPLOAD_BIN" 2>/dev/null || echo "")
            if ! echo "$FILE_TYPE" | grep -qiE "Mach-O|script|executable"; then
              echo "ERROR: download failed — file type: $FILE_TYPE"
              exit 0
            fi
            echo ">>> upload-symbols ready: $FILE_TYPE"
            DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
            [ ! -d "$DSYM_DIR" ] && DSYM_DIR=$(find build/ios/archive -maxdepth 3 -name "dSYMs" -type d 2>/dev/null | head -1)
            if [ -z "$DSYM_DIR" ] || [ ! -d "$DSYM_DIR" ]; then
              echo "ERROR: dSYM directory not found"
            else
              echo ">>> Uploading dSYMs from: $DSYM_DIR"
              find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
                echo "Uploading: $(basename $dsym)"
                "$UPLOAD_BIN" -gsp "$GSVC_PLIST" -p ios "$dsym" && echo "OK" || echo "FAIL"
              done
              echo ">>> Upload complete"
            fi
          } 2>&1 | tee "$LOG"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - $CM_BUILD_DIR/flutter_build_ipa.log
      - $CM_BUILD_DIR/dsym_upload.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ── iOS App Store review submission — manual only ────────────────────────────
  # Submits the pubspec version's newest processed build for App Store review
  # (auto-release after approval), setting "What's New" on every localization
  # from flutter_app/store/whats_new.json. Waits for processing, so the release
  # pipeline triggers it alongside flutter-release with NOT_BEFORE=<dispatch time>.
  # Idempotent. workflowId to use in API call: "appstore-submit"
  appstore-submit:
    name: Lalabuba iOS — Submit to App Store review
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events: []
    integrations:
      app_store_connect: Bonistock ASC
    environment:
      vars:
        APP_STORE_APPLE_ID: "6761691648"
    scripts:
      - name: Submit version for App Store review
        script: |
          # Use the interpreter codemagic-cli-tools runs on (it ships PyJWT + cryptography).
          PY=$(head -1 "$(command -v app-store-connect)" | sed 's/^#!//')
          $PY -c "import jwt" 2>/dev/null || { PY=python3; $PY -m pip install --quiet pyjwt cryptography; }
          set -o pipefail
          { echo "interpreter: $PY"; $PY scripts/asc_submit_review.py; } 2>&1 | tee "$CM_BUILD_DIR/asc_submit.log"
    artifacts:
      - $CM_BUILD_DIR/asc_submit.log
