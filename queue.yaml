# Social posting queue — read by the `social` service (scripts/social/runner.mjs)
# from GitHub main on every tick. Approving = committing + pushing; no redeploy.
#
# ── THE RULE ───────────────────────────────────────────────────────────────────
# A human chooses and approves every post. The service only chooses the minute.
#   • Only entries with   approved: "YYYY-MM-DD XX"   (date + Alex's initials) post.
#   • `approved` is set ONLY by Alex, by hand. No script and no Claude session ever
#     writes it — drafted entries always land without it.
#   • ≤ 1 post per account (brand × platform) per Berlin day — a code constant.
#   • Never the same image twice on a platform; never a repeated title or
#     destination link on an account (checked against `history` + the ledger).
#   • `date:` → posts only that day (a missed date is reported, never posted late).
#     No date → posts on the first free day, in file order.
#   • Nothing approved → nothing posts. There is no fallback content.
#
# See the 7-day plan before approving:   npm run social:plan
#
# ── FIELDS ─────────────────────────────────────────────────────────────────────
#   id           unique, stable (used for dedupe — never reuse one)
#   brand        lalabuba | bonifatus
#   platform     pinterest | instagram
#   image        /path on the brand's site, or https:// URL (Instagram: .jpg only)
#   images       Instagram carousel: list of 2–10 .jpg (instead of image)
#   title        Pinterest title (≤100). Instagram: internal label for dedupe.
#   description  Pinterest description (≤800) / Instagram caption (≤2200, ≤30 #)
#   link         Pinterest destination (required). Not used on Instagram.
#   alt          alt text (Pinterest ≤500)
#   board        Pinterest board name or numeric id
#   date         optional YYYY-MM-DD
#   approved     "YYYY-MM-DD XX" — Alex only
#   notes        free text, ignored
# Quote every value that contains ": " or starts with a special character.

